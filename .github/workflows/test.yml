# Runs the zero-dependency unit + architecture tests. No npm install needed.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test "tests/*.test.js"
